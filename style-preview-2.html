<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>风格 2 - 极简清爽</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F7F7F5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Georgia, sans-serif;
  }
  .card {
    background: white;
    border-radius: 4px;
    padding: 48px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .label {
    font-size: 11px;
    color: #999;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 20px;
    color: #1a1a1a;
    margin-bottom: 32px;
    line-height: 1.5;
    font-weight: 400;
  }
  .option {
    border-bottom: 1px solid #EBEBEB;
    padding: 16px 0;
    cursor: pointer;
    font-size: 15px;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.15s;
  }
  .option:hover { color: #1a1a1a; }
  .arrow { color: #CCC; font-size: 12px; }
  .option:hover .arrow { color: #1a1a1a; }
  .progress {
    display: flex;
    gap: 4px;
    margin-bottom: 32px;
  }
  .bar { height: 2px; flex: 1; background: #EBEBEB; }
  .bar.active { background: #1a1a1a; }
  .style-tag {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: #CCC;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="label">问题 2 / 5</div>
  <div class="progress">
    <div class="bar active"></div>
    <div class="bar active"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
  <h1>周末你最想做什么？</h1>
  <div class="option">去户外冒险，越刺激越好 <span class="arrow">→</span></div>
  <div class="option">窝在家里看剧喝东西 <span class="arrow">→</span></div>
  <div class="option">约朋友出来玩个痛快 <span class="arrow">→</span></div>
  <div class="option">找家甜品店慢慢享受 <span class="arrow">→</span></div>
  <div class="style-tag">风格 2 · 极简清爽</div>
</div>
</body>
</html>
